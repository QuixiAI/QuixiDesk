[package]
name = "quixi-engine"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
parking_lot.workspace = true
dashmap.workspace = true
dirs.workspace = true
tracing.workspace = true
reqwest.workspace = true
base64.workspace = true
sha2.workspace = true
url.workspace = true
ignore.workspace = true
regex.workspace = true
globset.workspace = true
tempfile.workspace = true
aisdk.workspace = true
futures-util.workspace = true
tokio.workspace = true
quixi-cordis.workspace = true
quixi-proto.workspace = true
quixi-platform.workspace = true
quixi-workspace.workspace = true
quixi-mcp.workspace = true
quixi-netstack.workspace = true
aes-gcm = "0.10"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
cron = "0.15"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Headless driver: same engine, no window. See src/bin/quixi-headless.rs.
[[bin]]
name = "quixi-headless"
path = "src/bin/quixi-headless.rs"
